<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Mr. Loveday's Classes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000000;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* Header Styling */
        .main-header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #000000, #000000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-header p {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        /* Split Container */
        .container {
            display: flex;
            width: 100%;
            gap: 30px;
            max-width: 1200px;
        }

        /* Card Link Basics */
        .card {
            flex: 1;
            text-decoration: none;
            color: inherit;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        /* Background Gradients */
        .science-card {
            background: linear-gradient(135deg, #000000 0%, #cc0001 100%);
            box-shadow: 0 10px 30px rgba(4, 120, 87, 0.2);
        }

        .robotics-card {
            background: linear-gradient(135deg, #000000 0%, #0277be 100%);
            box-shadow: 0 10px 30px rgba(29, 78, 216, 0.2);
        }

        /* Smooth Hover Dynamics */
        .card:hover {
            transform: translateY(-10px) scale(1.02);
        }

        .science-card:hover {
            box-shadow: 0 25px 50px rgba(204, 0, 1, 0.35);
        }

        .robotics-card:hover {
            box-shadow: 0 25px 50px rgba(2, 119, 190, 0.35);
        }

        /* Card Content Styling */
        .content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 450px;
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }

        .card:hover .icon {
            transform: scale(1.15) rotate(5deg);
        }

        .content h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffffff;
        }

        .content p {
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Styled Buttons */
        .btn-label {
            margin-top: 15px;
            padding: 12px 36px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 50px;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }

        /* Updated Button Hover Colors */
        .science-card:hover .btn-label {
            background: #cc0001;
            border-color: #cc0001;
            color: #ffffff;
        }

        .robotics-card:hover .btn-label {
            background: #0277be;
            border-color: #0277be;
            color: #ffffff;
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }
            .card {
                min-height: 340px;
            }
            .main-header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>Welcome to Mr. Loveday's Classroom</h1>
        <p>Select your destination to get started</p>
    </header>

    <div class="container">
        <a href="https://sites.google.com/cornerstonek12.org/7thgradescience26-27/home-page" class="card science-card">
            <div class="content">
                <div class="icon">🧬</div>
                <h2>Science</h2>
                
                <span class="btn-label">Launch Science</span>
            </div>
        </a>

        <a href="https://sites.google.com/cornerstonek12.org/ccarobotics?usp=sharing" class="card robotics-card">
            <div class="content">
                <div class="icon">🤖</div>
                <h2>Robotics</h2>
              
                <span class="btn-label">Launch Robotics</span>
            </div>
        </a>
    </div>
<hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 40px; width: 100%; max-width: 1200px;">
<div style="text-align: center; margin-top: 30px;">
    <h2 style="font-size: 1.8rem; margin-bottom: 8px;">🚽 Bathroom Sign-Out</h2>
    <p style="color: #94a3b8; margin-bottom: 16px;">Need to leave the room? Please use the link below before you go.</p>
    <a href="https://ericloveday.github.io/landing/bathroom.html" target="_blank" style="padding: 12px 28px; background-color: #1e293b; color: #f8fafc; text-decoration: none; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1); font-weight: 600; display: inline-block; transition: background 0.3s;">Open Sign-Out Form</a>
</div>
</body>
</html>
